<section class="w-full px-6 pb-16 pt-28 md:px-10 lg:px-12.5">
  <article class="mx-auto max-w-7xl overflow-hidden rounded-[2rem] bg-white/10 p-8 text-white backdrop-blur-sm md:p-12">
    <p class="text-sm uppercase tracking-[0.3em] text-white/75">{{ eyebrow }}</p>
    <h1 class="mt-4 text-4xl font-bold uppercase tracking-[0.14em] md:text-6xl">{{ title }}</h1>
    <p class="mt-6 max-w-2xl text-sm leading-7 text-white/85 md:text-base">
      {{ description }}
    </p>

    <div class="mt-10 flex flex-wrap gap-4">
      <a
        routerLink="/home"
        class="inline-flex items-center justify-center rounded-full border border-white/30 px-6 py-3 text-xs uppercase tracking-[0.25em] text-white transition hover:bg-white hover:text-black"
      >
        Volver a home
      </a>
    </div>
  </article>
</section>
