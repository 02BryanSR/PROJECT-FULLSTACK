<section class="w-full px-6 pb-16 pt-28 md:px-10 lg:px-12.5">
  <div class="mx-auto max-w-[1920px] space-y-8">
    <article
      class="overflow-hidden rounded-4xl bg-shell-975 text-white shadow-[0_30px_90px_rgba(0,0,0,0.35)]"
    >
      <div class="grid lg:grid-cols-[1.15fr_0.85fr]">
        <figure class="relative min-h-112 overflow-hidden md:min-h-144">
          <img
            [src]="heroImage()"
            [alt]="heroAlt()"
            class="absolute inset-0 h-full w-full object-cover"
          />
          <div
            aria-hidden="true"
            class="absolute inset-0 bg-linear-to-r from-black/75 via-black/35 to-black/15"
          ></div>

          <figcaption class="absolute inset-x-0 bottom-0 p-8 md:p-10">
            <p class="text-[11px] uppercase tracking-[0.3em] text-white/70">{{ eyebrow() }}</p>
            <h1
              class="mt-4 max-w-xl text-4xl font-bold uppercase tracking-[0.12em] md:text-5xl lg:text-6xl"
            >
              {{ title() }}
            </h1>
            <p class="mt-4 max-w-2xl text-sm leading-7 text-white/80 md:text-base">
              {{ description() }}
            </p>
          </figcaption>
        </figure>

        <div class="flex flex-col gap-10 bg-shell-900 p-8 md:p-10">
          <div>
            <p class="text-[11px] uppercase tracking-[0.3em] text-white/55">{{ accent() }}</p>

            <div class="mt-6 grid gap-4 sm:grid-cols-3 lg:grid-cols-1">
              @for (highlight of highlights(); track highlight) {
                <article class="rounded-3xl border border-white/10 bg-white/5 p-5">
                  <p class="text-sm font-medium uppercase tracking-[0.15em] text-white">
                    {{ highlight }}
                  </p>
                </article>
              }
            </div>
          </div>
        </div>
      </div>
    </article>

    <section class="space-y-5" aria-label="Productos">
      <div class="flex items-end justify-between gap-4">
        <div>
          <p class="text-[11px] uppercase tracking-[0.28em] text-neutral-500">Shop now</p>
          <h2 class="mt-3 text-2xl font-semibold uppercase tracking-[0.14em] text-neutral-950">
            Productos reales
          </h2>
        </div>

        <a
          routerLink="/cart"
          class="inline-flex items-center justify-center rounded-full border border-black/10 px-5 py-3 text-xs uppercase tracking-[0.22em] text-neutral-900 transition hover:border-black hover:bg-black hover:text-white"
        >
          Ver carrito
        </a>
      </div>

      @if (products().length) {
        <div class="grid auto-rows-auto gap-5 md:grid-cols-6 xl:grid-cols-12">
          @for (entry of productCards(); track entry.product.id) {
            <app-catalog-product-card
              [product]="entry.product"
              [variant]="entry.variant"
              [busy]="addingProductId() === entry.product.id"
              (add)="addToCart($event)"
            ></app-catalog-product-card>
          }
        </div>
      } @else {
        <article class="rounded-[1.6rem] border border-dashed border-black/15 bg-surface-panel px-5 py-8 text-sm leading-7 text-neutral-600">
          Todavia no hay productos reales para esta categoria.
        </article>
      }
    </section>
  </div>
</section>
