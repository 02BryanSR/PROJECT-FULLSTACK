<header class="hidden bg-transparent px-6 py-4 text-white md:px-10 lg:block lg:px-12.5">
  <section
    class="relative items-center text-sm uppercase tracking-[0.2em] lg:flex"
    [class.text-white]="isHome()"
    [class.text-black]="!isHome()"
  >
    <nav aria-label="Navegacion principal">
      <ul class="flex items-center gap-5">
        @for (link of navLinks(); track link.route) {
          <li>
            <a
              [routerLink]="link.route"
              routerLinkActive="after:scale-x-100"
              class="relative inline-flex items-center py-2 after:absolute after:bottom-0 after:left-0 after:h-px after:w-full after:origin-left after:scale-x-0 after:transition-transform after:duration-300 hover:after:scale-x-100"
              [class.text-white]="isHome()"
              [class.text-black]="!isHome()"
              [class.after:bg-white]="isHome()"
              [class.after:bg-black]="!isHome()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <a
      routerLink="/home"
      class="absolute left-1/2 -translate-x-1/2 text-xl font-bold tracking-[0.25em]"
      [class.text-white]="isHome()"
      [class.text-black]="!isHome()"
    >
      B S R
    </a>

    <div class="ml-auto flex items-center gap-5">
      <button
        type="button"
        aria-label="Buscar"
        class="inline-flex items-center justify-center py-2"
        [class.text-white]="isHome()"
        [class.text-black]="!isHome()"
      >
        <app-icon name="icon-search" class="h-5 w-5"></app-icon>
      </button>

      <button
        type="button"
        aria-label="Abrir compras"
        class="inline-flex items-center justify-center py-2"
        [class.text-white]="isHome()"
        [class.text-black]="!isHome()"
      >
        <app-icon name="icon-bag" class="h-5 w-5"></app-icon>
      </button>

      <app-account-menu [dark]="!isHome()"></app-account-menu>
    </div>
  </section>
</header>
