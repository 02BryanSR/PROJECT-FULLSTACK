<article
  class="group flex h-full cursor-pointer flex-col overflow-hidden rounded-[1.2rem] bg-black text-white shadow-[0_18px_45px_rgba(15,23,42,0.22)] transition duration-300 hover:-translate-y-1 hover:shadow-[0_28px_70px_rgba(15,23,42,0.28)]"
  [class]="articleClasses()"
  tabindex="0"
  role="link"
  [attr.aria-label]="'Abrir detalle de ' + product().name"
  (click)="openProductDetail()"
  (keydown)="handleKeydown($event)"
>
  <div class="relative overflow-hidden bg-surface-media" [class]="mediaClasses()">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full items-center justify-center bg-surface-soft px-5 text-center text-xs uppercase tracking-[0.24em] text-neutral-500">
        Sin imagen
      </div>
    }

    <div class="absolute left-4 top-4 flex items-center gap-2">
      <span class="rounded-full bg-black/80 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.24em] text-white">
        {{ variant() === 'featured' ? 'editorial' : variant() === 'standard' ? 'core' : 'edit' }}
      </span>
    </div>

    <button
      type="button"
      (click)="toggleFavorite($event)"
      class="absolute right-4 top-4 inline-flex h-9 min-w-9 items-center justify-center rounded-full border border-white/30 bg-black/35 px-3 text-[11px] uppercase tracking-[0.2em] text-white backdrop-blur transition hover:bg-black/70"
    >
      {{ isFavorite() ? 'Saved' : 'Save' }}
    </button>
  </div>

  <div class="flex flex-1 flex-col bg-black" [class]="bodyClasses()">
    <div>
      <p class="text-[10px] uppercase tracking-[0.24em] text-white/45">Producto</p>
      <h3 class="mt-3 font-semibold uppercase tracking-[0.08em] text-white" [class]="titleClasses()">
        {{ product().name }}
      </h3>
    </div>

    <div class="mt-auto flex items-end justify-between gap-4">
      <div>
        <p class="text-[10px] uppercase tracking-[0.24em] text-white/45">Precio</p>
        <strong class="mt-2 block text-lg font-semibold text-white md:text-xl">
          {{
            product().price !== null
              ? (product().price | currency: 'EUR' : 'symbol' : '1.0-2' : 'es')
              : 'Consultar'
          }}
        </strong>
      </div>

      <button
        type="button"
        [disabled]="busy()"
        (click)="requestAdd($event)"
        class="inline-flex h-10 min-w-10 items-center justify-center rounded-none border border-white/30 px-3 text-lg text-white transition hover:bg-white hover:text-black disabled:cursor-not-allowed disabled:opacity-40"
      >
        +
      </button>
    </div>
  </div>
</article>
